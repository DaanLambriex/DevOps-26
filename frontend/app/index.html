<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>GitHub Manager</h1>

    <button id="loadRepos">Load repositories</button>

    <div class="container">

        <div class="sidebar">
            <h3>Filter op topics</h3>
            <button id="clearFilters">Wis filters</button>
            <div id="topicFilters"></div>
        </div>

        <div class="content">

            <details open>
                <summary>Niet-gearchiveerde repositories</summary>
                <ul id="activeRepoList"></ul>
            </details>

            <details>
                <summary>Gearchiveerde repositories</summary>
                <ul id="archivedRepoList"></ul>
            </details>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
