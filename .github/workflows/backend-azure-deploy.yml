name: Backend Azure Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/GithubManager/**'
      - '.github/workflows/backend-azure-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/GithubManager/GithubManager.csproj

      - name: Build
        run: dotnet build backend/GithubManager/GithubManager.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/GithubManager.Tests/GithubManager.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish backend/GithubManager/GithubManager.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: githubmanager-daan
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
